[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockally-flask"
version = "0.1.0"
description = "Official Lockally extension for Flask — send transactional email via Lockally."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Lockally", email = "support@lockally.com" }]
keywords = ["lockally", "flask", "email", "transactional"]
dependencies = [
    "lockally>=0.1,<1",
    "flask>=2.2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://lockally.com"
Repository = "https://github.com/lockallyinc/lockally-flask"

[tool.setuptools]
packages = ["lockally_flask"]
